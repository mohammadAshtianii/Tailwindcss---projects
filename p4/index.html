<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&family=Rokkitt:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <script>
      tailwind.config = {
        theme: {
          fontFamily: {
            sans: ["Mulish", "sans-serif"],
            mono: ["Rokkitt", "monospace"],
          },
        },
      };
    </script>
  </head>
  <body>
    <div class="flex items-center justify-center min-h-screen bg-slate-400">
      <div
        class="relative flex flex-col md:flex-row m-6 space-y-10 bg-white shadow-2xl rounded-2xl md:space-y-10 md:m-0"
      >
        <div class="p-6 md:p-20">
          <h2 class="font-mono mb-5 text-4xl font-bold">Log in</h2>

          <p class="max-w-sm mb-12 font-sans font-light text-gray-600">
            Lorem ipsum dolor sit amet consectetur, adipisicing elit. Atque
            perspiciatis, ea facere doloremque nesciunt eos!
          </p>
          <input
            type="text"
            class="w-full border-1 p-6 border-gray-300 rounded-md placeholder:font-sans placeholder:font-light"
            placeholder="Enter your email adress"
          />

          <div
            class="flex flex-col items-center justify-center mt-6 md:space-x-10 space-y-7 md:flex-row md:space-y-0"
          >
            <div class="font-thin text-cyan-700">Forgot password</div>
            <button
              class="w-full md:w-auto flex items-center justify-center p-6 space-x-4 font-sans font-bold text-white rounded-md shadow-lg px-9 bg-cyan-700 shadow-cyan-100 hover:bg-opacity-90 shadow-sm hover:shadow-lg border transition hover:-translate-y-0.5 duration-150"
            >
              <span>Next</span>
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="w-7"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="#ffffff"
                fill="none"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <line x1="13" y1="18" x2="19" y2="12"></line>
                <line x1="13" y1="6" x2="19" y2="12"></line>
              </svg>
            </button>
          </div>
          <div class="border-b mt-12 border-b-gray-300"></div>
          <p class="py-6 text-sm font-thin text-center text-gray-400">
            Or log in with
          </p>
          <div
            class="flex flex-col md:flex-row justify-center items-center space-x-0 space-y-6 md:space-x-4 md:space-y-0"
          >
            <button
              class="flex items-center justify-center py-2 space-x-3 border border-gray-300 rounded shadow-sm hover:bg-opacity-30 hover:shadow-lg hover:-translate-y-0.5 transition duration-150 md:w-1/2 w-full"
            >
              <img src="./images/facebook.png" alt="" class="w-9" />
              <span class="font-thin">Facebook</span>
            </button>

            <button
              class="flex items-center justify-center py-2 space-x-3 border border-gray-300 rounded shodow-sm hover:bg-opacity-30 hover:shadow-lg hover:-translate-y-0.5 transition duration-150 md:w-1/2 w-full"
            >
              <img src="./images/google.png" alt="" class="w-9" />
              <span class="font-thin">Goggle</span>
            </button>
          </div>
        </div>
        <img
          src="./images/image.jpg"
          alt=""
          class="w-[430px] md:block hidden"
        />
      </div>
    </div>
  </body>
</html>
